name: release

# Every push to main updates the release PR (version in plugin.json plus CHANGELOG.md).
# Merging that PR tags the version and publishes the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
      # Tags made with GITHUB_TOKEN don't trigger other workflows, so attach get.sh here.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - name: Attach get.sh to the release
        if: ${{ steps.release.outputs.release_created }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" setup/get.sh
        env:
          GH_TOKEN: ${{ github.token }}
